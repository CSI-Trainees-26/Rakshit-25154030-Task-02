<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">

</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <ul class="vertical-bar-items">
                <li><a href="#">Item 1</a></li>
                <li><a href="#">Item 2</a></li>
                <li><a href="#">Item 3</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="top-nav">
                <ul class="items">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Redis</a></li>
                </ul>
                <a href="#profile" class="user-profile-link">
                    <img src="Assets/avatar.png" alt="Profile" class="avatar-img" />
                    <span class="user-name">Rakshit</span>
                </a>
            </header>

            <div class="Dashboard-area">
                <section class="banner-card">
                    <div>
                        <h2>Welcome Back Rakshit</h2>
                        <p>quote</p>
                    </div>

                    <div>
                        banner images
                    </div>
                </section>
                <section class="card-container">
                    <div class="task-bar cards">
                        <h3>Tasks</h3>
                    </div>

                    <div class="weekly-progress cards">
                        weekly progress
                    </div>
                    <div class="habits-card cards">
                        habits card
                    </div>
                </section>
                <section class="bottom-grid">
                    <div class="dailyTask-manager">
                        <div class="task-adder">
                            <input type="text" placeholder="Add a task" />
                            <select name="priority" id="priority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                            <button class="addtask">Add Task</button>
                        </div>
                            <div class="task-state">
                                <div class="pending">
                                    <h4>Pending</h4>
                                </div>
                                <div class="completed">
                                    <h4>Completed</h4>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                    <div class="water-intake-tracker"></div>
                    <div class="daily-quote"></div>
                </section>
            </div>
        
        </main>
    </div>
</body>
</html>
